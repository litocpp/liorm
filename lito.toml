[package]
name = "liorm"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[lib]
name = "liorm"
module = "liorm"
archive = "liorm"

[features.sqlito]
default = true

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-core = { version = "0.1.9", pub = true }
rstd-std = { version = "0.1.9", pub = true }
sqlito = { version = "0.1.0", pub = true, condition = "feature.sqlito" }
